<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url('fonts/Pretendard-Black.woff2');font-weight:900}
@font-face{font-family:P;src:url('fonts/Pretendard-ExtraBold.woff2');font-weight:800}
@font-face{font-family:P;src:url('fonts/Pretendard-Bold.woff2');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0a0d;font-family:P,sans-serif;word-break:keep-all}
#glow{position:absolute;width:1400px;height:1400px;left:-160px;top:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,206,150,.08),transparent 65%)}
#grain{position:absolute;left:-40px;top:-40px;width:1160px;height:2000px;opacity:.5;mix-blend-mode:screen;background-size:580px 1000px}
.layer{position:absolute;inset:0;opacity:0}
.mid{position:absolute;left:70px;right:70px;top:0;height:1680px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.st{font-weight:800;font-size:88px;line-height:1.42;letter-spacing:-2.5px;color:#F4F1EC}
.st em{font-style:normal;color:#F2C98B}
.st .s{display:block;margin-top:34px;font-weight:700;font-size:58px;color:rgba(244,241,236,.6);letter-spacing:-1px}
.w{display:inline-block;white-space:pre}
.c{display:inline-block}
.hk{font-weight:900;font-size:118px;line-height:1.32;letter-spacing:-3px;color:#fff;margin-top:44px}
.mk{background:#FFD84D;color:#111;padding:0 14px;border-radius:10px}
.sub{margin-top:50px;font-weight:800;font-size:54px;color:rgba(255,255,255,.72);letter-spacing:-1px}
.lab{font-weight:800;font-size:46px;letter-spacing:2px;color:#F2C98B}
.card{position:relative;overflow:hidden;width:560px;height:840px;margin-top:40px;border-radius:24px;background-position:center;background-size:cover;box-shadow:0 0 0 2px rgba(242,201,139,.85),0 30px 90px rgba(0,0,0,.8),0 0 150px rgba(255,200,130,.22)}
.cn{margin-top:50px;font-weight:900;font-size:80px;color:#fff;letter-spacing:-2px}
.cm{margin-top:18px;font-weight:800;font-size:56px;color:#F2C98B;letter-spacing:-1px}
.btns{margin-top:30px}
.sweep{position:absolute;top:-20%;width:45%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,240,210,.28),transparent);transform:rotate(12deg)}
.btns{display:flex;justify-content:center;gap:90px;margin-top:40px}
.ib{display:flex;flex-direction:column;align-items:center;gap:14px}
.ib svg{padding:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.ib b{font-weight:800;font-size:36px;color:#fff;letter-spacing:-1px}
.ab{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
</style></head><body><div id="glow"></div><div id="stage"></div><div id="grain"></div><script>
let TL;const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
function words(markup){ // | line break, *..* em, ~ prefix = small line
  let html='',idx=0; const lines=markup.split('|');
  lines.forEach((ln,li)=>{ let small=ln.startsWith('~'); if(small)ln=ln.slice(1);
    let inEm=false; const toks=ln.split(' ');
    let lh=''; toks.forEach((tk,ti)=>{ // '*' toggles emphasis anywhere inside a token (e.g. *내 마음*은)
      let inner=''; let n=[...tk.replace(/\*/g,'')].length, ci=0; let buf='';
      const flush=()=>{ if(buf){ inner+= inEm?`<em>${buf}</em>`:buf; buf=''; } };
      for(const ch of [...tk]){ if(ch==='*'){ flush(); inEm=!inEm; continue; } buf+=`<span class="c" data-c="${ci++}" data-n="${n}">${ch}</span>`; }
      flush(); lh+=`<span class="w" data-i="${idx++}">${inner}${ti<toks.length-1?' ':''}</span>`; });
    html+= small?`<span class="s">${lh}</span>`:(li>0?'<br>':'')+lh; });
  return {html,n:idx};
}
function grain(){const c=document.createElement('canvas');c.width=580;c.height=1000;const x=c.getContext('2d');const d=x.createImageData(580,1000);
 let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
 for(let i=0;i<d.data.length;i+=4){const v=r()>0.5?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.floor(Math.abs(r()-0.5)*2*40)}
 x.putImageData(d,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const PLANE='<svg viewBox="0 0 48 48" width="92" height="92"><g fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"><path d="M44 6L4 21l16 6 6 16z"/><path d="M44 6L20 27"/></g></svg>';
const MARK='<svg viewBox="0 0 48 48" width="92" height="92"><path d="M12 6h24v36L24 32 12 42z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/></svg>';
function init(tl,spec){TL=tl;grain();const st=$('#stage');
 const hook=spec.hook.map(l=>esc(l).replace(/\[(.+?)\]/g,'<span class="mk">$1</span>')).join('<br>');
 for(const it of tl.items){ if(it.scene==='end2')continue; const d=document.createElement('div');d.className='layer';d.id='L_'+it.scene;
  if(it.scene==='cover') d.innerHTML=`<div class="mid"><div class="hk" style="margin-top:0">${hook}</div>${spec.sub?`<div class="sub">${esc(spec.sub)}</div>`:''}</div>`;
  else if(it.scene==='end') d.innerHTML=`<div class="ab lab e0" style="top:180px">이 이야기의 카드</div><div class="ab" style="top:330px"><div class="card e1" style="margin:0;width:540px;height:810px;background-image:url('${spec.cardUrl}')"><div class="sweep"></div></div></div>
<div class="ab e2" style="top:1255px"><div class="cn" style="margin:0">${esc(spec.cardName)}</div><div class="cm">${esc(spec.cardLine)}</div></div>
<div class="ab c1" style="top:1240px"><div style="font-weight:900;font-size:60px;line-height:1.36;letter-spacing:-2px;color:#fff">${esc(spec.cta[0])}<br><span style="color:#FFD84D">${esc(spec.cta[1])}</span></div></div>
<div class="ab c2" style="top:1475px"><div class="btns" style="margin:0;gap:110px"><div class="ib">${PLANE}<b>공유하기</b></div><div class="ib">${MARK}<b>저장하기</b></div></div></div>`;
  else { const w=words(it.text); it.n=w.n; d.innerHTML=`<div class="mid"><div class="st">${w.html}</div></div>`; }
  st.appendChild(d);} }
function render(t){
 const its=TL.items.filter(x=>x.scene!=='end2');
 $('#glow').style.transform=`scale(${1+0.08*t/TL.total}) translateY(${-20*t/TL.total}px)`;
 $('#grain').style.transform=`translate(${(Math.floor(t*12)*37)%40-20}px,${(Math.floor(t*12)*53)%40-20}px)`;
 its.forEach((it,i)=>{ const L=document.getElementById('L_'+it.scene); const nx=its[i+1];
  const a=it.start-(i?0.2:0.3), b=nx?nx.start-0.2:TL.total+1;
  let o=Math.min(cl((t-a)/0.25), cl((b-t)/0.25)); if(i===0&&t<0.3)o=1;
  L.style.opacity=o; L.style.display=o>0?'block':'none';
  const z=1+0.035*cl((t-a)/(b-a)); {const m=L.querySelector('.mid'); if(m) m.style.transform=`scale(${z})`;}
  if(it.n){ const ws=it.words||[]; L.querySelectorAll('.w').forEach(w=>{const k=+w.dataset.i; const wb=ws[k]||{t:it.dur*0.82*k/it.n,d:0.35};
     w.querySelectorAll('.c').forEach(c=>{const ci=+c.dataset.c, n=+c.dataset.n; const t0=it.start+wb.t+wb.d*ci/n-0.06; const x=cl((t-t0)/0.5); const e=1-Math.pow(1-x,2);
       c.style.opacity=e; c.style.transform=`translateY(${(1-e)*8}px)`;}); }); }
  if(it.scene==='end'){ const s=it.start;
   const f=(sel,t0,dy=20)=>L.querySelectorAll(sel).forEach(e=>{const k=ease((t-t0)/0.5);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*dy}px)`});
   f('.e0',s-0.2); const k=ease((t-(s-0.1))/0.9); const c=L.querySelector('.card'); c.style.opacity=k; const fl=Math.sin((t-s)*1.3)*6*k; c.style.transform=`translateY(${fl}px) scale(${(0.86+0.14*k)*(1+0.03*cl((t-s)/8))})`; const sw=c.querySelector('.sweep'); const ph=((t-s-0.6)%3.2)/3.2; sw.style.left=(-60+180*cl(ph*1.6))+'%'; sw.style.opacity=(t>s+0.6)?1:0;
   const pulse=0.22+0.12*Math.sin(t*2.4); c.style.boxShadow=`0 0 0 2px rgba(242,201,139,.85),0 30px 90px rgba(0,0,0,.8),0 0 ${150+120*(1-cl((t-s)/1.5))}px rgba(255,200,130,${pulse+0.3*(1-cl((t-s)/1.5))})`;
   const e2s=TL.items.find(x=>x.scene==='end2').start; f('.e2',s+1.1);
   L.querySelectorAll('.e2').forEach(e=>{const k=cl((t-(e2s-0.45))/0.35); if(k>0){e.style.opacity=Math.min(+e.style.opacity,1-k);}});
   f('.c1',e2s-0.1); f('.c2',e2s+1.0); }
 });
}
</script></body></html>
