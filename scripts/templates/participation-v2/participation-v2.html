<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url('../story-reel/fonts/Pretendard-Black.woff2');font-weight:900}
@font-face{font-family:P;src:url('../story-reel/fonts/Pretendard-ExtraBold.woff2');font-weight:800}
@font-face{font-family:P;src:url('../story-reel/fonts/Pretendard-Bold.woff2');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0d12;font-family:P,sans-serif;word-break:keep-all}
#bg{position:absolute;inset:0;background:url(velvet.png) center/cover}
#light{position:absolute;left:-200px;top:-500px;width:1480px;height:1300px;background:radial-gradient(ellipse at 50% 30%,rgba(255,214,160,.13),transparent 60%)}
.hook{position:absolute;left:60px;right:60px;top:250px;text-align:center;font-weight:900;font-size:92px;line-height:1.3;letter-spacing:-3px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3),0 8px 34px rgba(0,0,0,.8)}
.mk{background:#FFD84D;color:#111;padding:0 14px;border-radius:10px}
.pick{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:46px;color:#fff;letter-spacing:-1px;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.pick small{display:block;margin-top:12px;font-size:34px;color:rgba(255,255,255,.6);font-weight:700}
.halo{position:absolute;width:280px;height:380px;border-radius:50%;filter:blur(42px);opacity:.42}
.cw{position:absolute;width:244px;height:402px;perspective:1800px}
.in{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;box-shadow:0 26px 50px rgba(0,0,0,.75),0 6px 14px rgba(0,0,0,.6)}
.face svg{position:absolute;inset:0;width:100%;height:100%}
.front{transform:rotateY(180deg);background:#000}.front img{width:100%;height:100%;object-fit:cover}
.gloss{position:absolute;inset:-10%;mix-blend-mode:screen}
.edge{position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.n{position:absolute;width:244px;text-align:center;font-weight:900;font-size:84px;color:#fff;letter-spacing:-2px;text-shadow:0 4px 18px rgba(0,0,0,.85)}
.cn{position:absolute;width:244px;text-align:center;font-weight:900;font-size:42px;color:#fff;letter-spacing:-1px;text-shadow:0 3px 12px rgba(0,0,0,.9)}
.cn small{display:block;font-weight:700;font-size:20px;color:#F2C98B;margin-top:4px;letter-spacing:.5px;white-space:nowrap;text-transform:uppercase}
.cn{white-space:nowrap}
.cnt{position:absolute;left:0;right:0;top:640px;line-height:1;text-align:center;font-weight:900;font-size:220px;color:#fff;letter-spacing:-8px;-webkit-text-stroke:6px rgba(20,10,30,.6);paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.9),0 0 90px rgba(255,216,77,.35)}
.glow{position:absolute;left:290px;top:560px;width:500px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,77,.45),rgba(255,180,80,.15) 40%,transparent 68%)}
.end{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;line-height:1.35;letter-spacing:-2px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.8)}
.end .y{color:#FFD84D}
.end2{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:rgba(255,255,255,.78);letter-spacing:-1px}
.L{position:absolute;inset:0}
.burst{position:absolute;width:520px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,170,.75),rgba(255,190,110,.25) 40%,transparent 70%);pointer-events:none}
</style></head><body><div id="bg"></div><div id="light"></div>
<div class="L" id="hook"><div class="hook" style="top:270px"></div></div>
<div class="L" id="end"><div class="end" style="top:270px;font-size:84px">1·2·3번 해석은<br><span class="y">고정댓글</span>에 적어둘게요</div></div>
<div class="pick" id="p1" style="top:770px">직감으로 한 장만 골라보세요</div>
<div class="pick" id="p2" style="top:735px">마음 가는 카드에 눈을 멈추세요<small>3초 뒤 공개됩니다</small></div>
<div class="pick" id="p3" style="top:770px">고른 번호의 카드예요</div>
<div class="pick" id="p4" style="top:735px">고른 번호를 댓글에 남겨주세요<small style="color:#fff;font-size:38px">복채는 ❤️ 좋아요와 팔로우</small></div>
<div class="glow" id="glow"></div><div class="cnt" id="cnt"></div>
<div id="cards"></div>
<script>
let DEFS='', RB={}, NAMES=[], IMGS=[], KEYS=[];
const X=[148,418,688], TOP=900;
let HALO=[];
const reel=k=>`<svg viewBox="0 0 120 198" preserveAspectRatio="none"><defs>${DEFS}</defs>${RB[k]}</svg>`;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)}, eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function init(spec){ DEFS=spec.defs; RB=spec.rb; KEYS=spec.schemes; HALO=spec.halo; IMGS=spec.cards.map(c=>c.url); NAMES=spec.cards.map(c=>[esc(c.name),esc(c.nameEn)]);
 setTimeout(()=>{},0);
 document.querySelector('#hook .hook').innerHTML=spec.hook.map(l=>esc(l).replace(/\[(.+?)\]/g,'<span class="mk">$1</span>')).join('<br>');
 $('cards').innerHTML=[0,1,2].map(i=>`<div class="halo" style="left:${X[i]-20}px;top:${TOP+60}px;background:${HALO[i]}"></div>
<div class="burst" id="b${i}" style="left:${X[i]-138}px;top:${TOP-109}px;opacity:0"></div>
<div class="cw" style="left:${X[i]}px;top:${TOP}px" id="w${i}"><div class="in" id="in${i}">
<div class="face back">${reel(KEYS[i])}<div class="gloss" id="g${i}"></div><div class="edge"></div></div>
<div class="face front"><img src="${IMGS[i]}"><div class="edge"></div></div></div></div>
<div class="n" id="n${i}" style="left:${X[i]}px;top:1320px">${i+1}</div>
<div class="cn" id="cn${i}" style="left:${X[i]}px;top:1418px;opacity:0">${NAMES[i][0]}<small>${NAMES[i][1]}</small></div>`).join(''); }
const T={pick2:2.4,cd:3.4,flip:6.4,names:7.3,end:8.6,total:11.0};
function fitNames(){ for(let i=0;i<3;i++){ const e=$('cn'+i); if(!e) continue; let fs=42; e.style.fontSize=fs+'px'; while(e.scrollWidth>e.clientWidth+1 && fs>28){ fs-=2; e.style.fontSize=fs+'px'; } const sm=e.querySelector('small'); let f2=20; while(sm && sm.scrollWidth>e.clientWidth+1 && f2>14){ f2-=1; sm.style.fontSize=f2+'px'; } } }
function fade(id,a,b,t,d=.3){const o=Math.min(cl((t-a)/d),cl((b-t)/d)); $(id).style.opacity=o;}
function render(t){
 fade('hook',-1,T.end,t,.25); fade('end',T.end+.02,99,t,.35);
 $('end').style.transform=`translateY(${(1-eo((t-T.end-.02)/.5))*24}px)`; $('hook').style.transform=`translateY(${-eo((t-T.end+.25)/.25)*20}px)`;
 fade('p1',-1,T.pick2,t,.25); fade('p2',T.pick2,T.cd,t,.25); fade('p3',T.flip+.2,T.end,t,.3); fade('p4',T.end+.3,99,t,.4);
 // countdown
 const c=t-T.cd; const cnt=$('cnt'), g=$('glow');
 if(c>=0 && c<3){ const k=Math.floor(c), f=c-k; cnt.textContent=3-k; const e=eo(f/.35);
   cnt.style.opacity=Math.min(e, cl((1-f)/.15)); cnt.style.transform=`scale(${1.6-0.6*e})`; g.style.opacity=.55+.45*Math.sin(Math.PI*cl(f/.6)); }
 else { cnt.style.opacity=0; g.style.opacity=0; }
 for(let i=0;i<3;i++){
  const f0=T.flip+i*.18, fl=eio((t-f0)/.6);
  $('in'+i).style.transform=`rotateY(${180*fl}deg)`;
  $('w'+i).style.transform=`translateY(${-Math.sin(Math.PI*cl((t-f0)/.6))*26}px) scale(${1+0.04*Math.sin(Math.PI*cl((t-f0)/.6))})`;
  $('b'+i).style.opacity=0.9*Math.sin(Math.PI*cl((t-f0-.25)/1.1));
  // gloss sweep: once at 0.6s, once at 2.6s, faint static otherwise
  const sw=[0.5+i*.12, 2.5+i*.12].map(s=>cl((t-s)/1.0)).find(v=>v>0&&v<1);
  const pos= sw===undefined ? -40 : -40+180*sw;
  $('g'+i).style.background=`linear-gradient(115deg,transparent ${pos}%,rgba(255,255,255,${sw===undefined?0:.22}) ${pos+12}%,transparent ${pos+26}%),linear-gradient(115deg,rgba(255,255,255,.05),transparent 40%)`;
  $('cn'+i).style.opacity=eo((t-T.names-i*.1)/.4); $('cn'+i).style.transform=`translateY(${(1-eo((t-T.names-i*.1)/.4))*14}px)`;
 }
 $('bg').style.transform=`scale(${1+0.03*t/T.total})`;
}
</script></body></html>
